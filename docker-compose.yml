name: tradehub

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB:       tradehub
      POSTGRES_USER:     tradehub
      POSTGRES_PASSWORD: tradehub_pass
    ports:
    - "5434:5432"
    volumes:
    - tradehub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradehub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [tradehub]

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass tradehub_redis_pass
    ports:
    - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "tradehub_redis_pass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [tradehub]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: tradehub
      RABBITMQ_DEFAULT_PASS: tradehub_pass
    ports:
    - "5674:5672"
    - "15674:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks: [tradehub]

  # ── Application Services ─────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./tradehub/services/api-gateway
      dockerfile: Dockerfile
    image: tradehub/api-gateway:latest
    ports:
    - "8200:8200"
    environment:
      PORT: "8200"
      DB_URL: postgres://tradehub:tradehub_pass@postgres:5432/tradehub?sslmode=disable
      REDIS_URL: redis://:tradehub_redis_pass@redis:6379
      RABBITMQ_URL: amqp://tradehub:tradehub_pass@rabbitmq:5672
      JWT_SECRET: tradehub-jwt-secret-key-2024
    env_file: [.env]
    depends_on:
      postgres:  { condition: service_healthy }
      redis:     { condition: service_healthy }
      rabbitmq:  { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8200/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [tradehub]
    restart: unless-stopped

  trader-service:
    build:
      context: ./tradehub/services/trader-service
      dockerfile: Dockerfile
    image: tradehub/trader-service:latest
    ports:
    - "8201:8201"
    environment:
      PORT: "8201"
      DB_URL: postgres://tradehub:tradehub_pass@postgres:5432/tradehub?sslmode=disable
      REDIS_URL: redis://:tradehub_redis_pass@redis:6379
      RABBITMQ_URL: amqp://tradehub:tradehub_pass@rabbitmq:5672
      JWT_SECRET: tradehub-jwt-secret-key-2024
    env_file: [.env]
    depends_on:
      postgres:  { condition: service_healthy }
      redis:     { condition: service_healthy }
    networks: [tradehub]
    restart: unless-stopped

  trading-account-service:
    build:
      context: ./tradehub/services/trading-account-service
      dockerfile: Dockerfile
    image: tradehub/trading-account-service:latest
    ports:
    - "8202:8202"
    environment:
      PORT: "8202"
      DB_URL: postgres://tradehub:tradehub_pass@postgres:5432/tradehub?sslmode=disable
      REDIS_URL: redis://:tradehub_redis_pass@redis:6379
      JWT_SECRET: tradehub-jwt-secret-key-2024
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [tradehub]
    restart: unless-stopped

  order-management-service:
    build:
      context: ./tradehub/services/order-management-service
      dockerfile: Dockerfile
    image: tradehub/order-management-service:latest
    ports:
    - "8203:8203"
    environment:
      PORT: "8203"
      DB_URL: postgres://tradehub:tradehub_pass@postgres:5432/tradehub?sslmode=disable
      RABBITMQ_URL: amqp://tradehub:tradehub_pass@rabbitmq:5672
      JWT_SECRET: tradehub-jwt-secret-key-2024
    env_file: [.env]
    depends_on:
      postgres:  { condition: service_healthy }
      rabbitmq:  { condition: service_healthy }
    networks: [tradehub]
    restart: unless-stopped

  execution-engine:
    build:
      context: ./tradehub/services/execution-engine
      dockerfile: Dockerfile
    image: tradehub/execution-engine:latest
    ports:
    - "8204:8204"
    environment:
      PORT: "8204"
      DB_URL: postgres://tradehub:tradehub_pass@postgres:5432/tradehub?sslmode=disable
      RABBITMQ_URL: amqp://tradehub:tradehub_pass@rabbitmq:5672
      JWT_SECRET: tradehub-jwt-secret-key-2024
    env_file: [.env]
    depends_on:
      postgres:  { condition: service_healthy }
      rabbitmq:  { condition: service_healthy }
    networks: [tradehub]
    restart: unless-stopped

  clearing-service:
    build:
      context: ./tradehub/services/clearing-service
      dockerfile: Dockerfile
    image: tradehub/clearing-service:latest
    ports:
    - "8205:8205"
    environment:
      PORT: "8205"
      DB_URL: postgres://tradehub:tradehub_pass@postgres:5432/tradehub?sslmode=disable
      JWT_SECRET: tradehub-jwt-secret-key-2024
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [tradehub]
    restart: unless-stopped

  portfolio-service:
    build:
      context: ./tradehub/services/portfolio-service
      dockerfile: Dockerfile
    image: tradehub/portfolio-service:latest
    ports:
    - "8206:8206"
    environment:
      PORT: "8206"
      DB_URL: postgres://tradehub:tradehub_pass@postgres:5432/tradehub?sslmode=disable
      JWT_SECRET: tradehub-jwt-secret-key-2024
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [tradehub]
    restart: unless-stopped

  market-data-service:
    build:
      context: ./tradehub/services/market-data-service
      dockerfile: Dockerfile
    image: tradehub/market-data-service:latest
    ports:
    - "8207:8207"
    environment:
      PORT: "8207"
      DB_URL: postgres://tradehub:tradehub_pass@postgres:5432/tradehub?sslmode=disable
      REDIS_URL: redis://:tradehub_redis_pass@redis:6379
      JWT_SECRET: tradehub-jwt-secret-key-2024
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [tradehub]
    restart: unless-stopped

  notification-service:
    build:
      context: ./tradehub/services/notification-service
      dockerfile: Dockerfile
    image: tradehub/notification-service:latest
    ports:
    - "8208:8208"
    environment:
      PORT: "8208"
      DB_URL: postgres://tradehub:tradehub_pass@postgres:5432/tradehub?sslmode=disable
      RABBITMQ_URL: amqp://tradehub:tradehub_pass@rabbitmq:5672
    env_file: [.env]
    depends_on:
      rabbitmq: { condition: service_healthy }
    networks: [tradehub]
    restart: unless-stopped

volumes:
  tradehub-postgres-data:

networks:
  tradehub:
    driver: bridge
    name: tradehub-network
