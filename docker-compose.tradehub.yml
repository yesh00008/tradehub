  # Service 9: Notification Service (8208)
  tradehub-notification:
    build:
      context: ./tradehub/services/notification-service
      dockerfile: Dockerfile
    container_name: tradehub-notification
    ports:
      - "8208:8208"
    environment:
      - PORT=8208
      - DATABASE_URL=postgres://fintech:fintech123@payflow-postgres:5432/tradehub?sslmode=disable
      - REDIS_URL=payflow-redis:6379
      - RABBITMQ_URL=amqp://fintech:rabbit123@payflow-rabbitmq:5672/
    networks:
      - payflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8208/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API (BFF) - Node.js (5000)
  tradehub-backend-api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: tradehub-backend-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - API_GATEWAY_URL=http://tradehub-api-gateway:8200
      - TRADER_SERVICE_URL=http://tradehub-trader-service:8201
      - TRADING_ACCOUNT_URL=http://tradehub-trading-account:8202
      - ORDER_MANAGEMENT_URL=http://tradehub-order-management:8203
      - EXECUTION_ENGINE_URL=http://tradehub-execution-engine:8204
      - CLEARING_SERVICE_URL=http://tradehub-clearing-service:8205
      - PORTFOLIO_SERVICE_URL=http://tradehub-portfolio-service:8206
      - MARKET_DATA_URL=http://tradehub-market-data:8207
      - NOTIFICATION_URL=http://tradehub-notification:8208
    depends_on:
      - tradehub-api-gateway
    networks:
      - payflow-network
    restart: unless-stopped

  # Frontend - React (3003)
  tradehub-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradehub-frontend
    ports:
      - "3003:3003"
    depends_on:
      - tradehub-backend-api
    networks:
      - payflow-network
    restart: unless-stopped

networks:
  payflow-network:
    external: true
