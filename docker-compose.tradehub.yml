      timeout: 10s
      retries: 3

  # Service 6: Clearing Service (8205)
  tradehub-clearing-service:
    build:
      context: ./tradehub/services/clearing-service
      dockerfile: Dockerfile
    container_name: tradehub-clearing-service
    ports:
      - "8205:8205"
    environment:
      - PORT=8205
      - DATABASE_URL=postgres://fintech:fintech123@payflow-postgres:5432/tradehub?sslmode=disable
      - REDIS_URL=payflow-redis:6379
      - RABBITMQ_URL=amqp://fintech:rabbit123@payflow-rabbitmq:5672/
    networks:
      - payflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8205/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Service 7: Portfolio Service (8206)
  tradehub-portfolio-service:
    build:
      context: ./tradehub/services/portfolio-service
      dockerfile: Dockerfile
    container_name: tradehub-portfolio-service
    ports:
      - "8206:8206"
    environment:
      - PORT=8206
      - DATABASE_URL=postgres://fintech:fintech123@payflow-postgres:5432/tradehub?sslmode=disable
      - REDIS_URL=payflow-redis:6379
    networks:
      - payflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8206/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Service 8: Market Data Service (8207)
  tradehub-market-data:
    build:
      context: ./tradehub/services/market-data-service
      dockerfile: Dockerfile
    container_name: tradehub-market-data
    ports:
      - "8207:8207"
    environment:
      - PORT=8207
      - DATABASE_URL=postgres://fintech:fintech123@payflow-postgres:5432/tradehub?sslmode=disable
      - REDIS_URL=payflow-redis:6379
