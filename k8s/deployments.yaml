---
# ─── API Gateway (8200) ───────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradehub-api-gateway
  namespace: tradehub
  labels:
    app: tradehub-api-gateway
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tradehub-api-gateway
  template:
    metadata:
      labels:
        app: tradehub-api-gateway
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8200"
    spec:
      containers:
      - name: api-gateway
        image: tradehub/api-gateway:latest
        imagePullPolicy: Never
        ports:
        - { containerPort: 8200, name: http }
        envFrom:
        - configMapRef: { name: tradehub-config }
        - secretRef:    { name: tradehub-secrets }
        resources:
          requests: { memory: "128Mi", cpu: "100m" }
          limits:   { memory: "256Mi", cpu: "500m" }
        livenessProbe:
          httpGet: { path: /health, port: 8200 }
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet: { path: /health, port: 8200 }
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tradehub-api-gateway
  namespace: tradehub
spec:
  selector:
    app: tradehub-api-gateway
  ports:
  - { port: 8200, targetPort: 8200, name: http }

